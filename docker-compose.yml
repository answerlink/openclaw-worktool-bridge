services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
    environment:
      TZ: Asia/Shanghai
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change_me_root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-worktool_bridge}
      MYSQL_USER: ${MYSQL_USER:-worktool}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-change_me_app}
    volumes:
      - ./mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "7"
    networks:
      - worktool-net

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      PYTHONUNBUFFERED: ${PYTHONUNBUFFERED:-1}
      APP_DEPLOYMENT_MODE: ${APP_DEPLOYMENT_MODE:-private}
      PRIVATE_OUTBOUND_ALLOW_LOOPBACK: ${PRIVATE_OUTBOUND_ALLOW_LOOPBACK:-false}
      APP_MYSQL_HOST: ${APP_MYSQL_HOST:-}
      APP_MYSQL_PORT: ${APP_MYSQL_PORT:-3306}
      APP_MYSQL_USER: ${APP_MYSQL_USER:-}
      APP_MYSQL_PASSWORD: ${APP_MYSQL_PASSWORD:-}
      APP_MYSQL_DATABASE: ${APP_MYSQL_DATABASE:-}
      APP_MYSQL_TIME_ZONE: ${APP_MYSQL_TIME_ZONE:-+08:00}
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:-}
      AUTH_JWT_EXPIRE_DAYS: ${AUTH_JWT_EXPIRE_DAYS:-30}
      AUTH_PBKDF2_ITERATIONS: ${AUTH_PBKDF2_ITERATIONS:-390000}
      AUTH_SMS_ENABLED: ${AUTH_SMS_ENABLED:-false}
      PRIVATE_ADMIN_USERNAME: ${PRIVATE_ADMIN_USERNAME:-admin}
      PRIVATE_ADMIN_PASSWORD: ${PRIVATE_ADMIN_PASSWORD:-}
      PRIVATE_SELF_REGISTRATION_ENABLED: ${PRIVATE_SELF_REGISTRATION_ENABLED:-false}
      ENABLE_TROUBLESHOOT: ${ENABLE_TROUBLESHOOT:-false}
      ENABLE_RUNTIME_WORKTOOL_SETTINGS: ${ENABLE_RUNTIME_WORKTOOL_SETTINGS:-false}
      ENABLE_ADMIN_IP_BLACKLIST: ${ENABLE_ADMIN_IP_BLACKLIST:-false}
      ENABLE_ADMIN_ENTERPRISE_AUTH: ${ENABLE_ADMIN_ENTERPRISE_AUTH:-false}
      ENABLE_OPEN_TROUBLESHOOT_API: ${ENABLE_OPEN_TROUBLESHOOT_API:-false}
      OPEN_TROUBLESHOOT_API_KEY: ${OPEN_TROUBLESHOOT_API_KEY:-}
      OPEN_TROUBLESHOOT_ALLOWED_ROBOT_IDS: ${OPEN_TROUBLESHOOT_ALLOWED_ROBOT_IDS:-}
      WORKTOOL_IPACL_QUERY_PATH: ${WORKTOOL_IPACL_QUERY_PATH:-}
      WORKTOOL_IPACL_ADD_PATH: ${WORKTOOL_IPACL_ADD_PATH:-}
      WORKTOOL_IPACL_DELETE_PATH: ${WORKTOOL_IPACL_DELETE_PATH:-}
      WORKTOOL_WEWORK_AUTH_LIST_PATH: ${WORKTOOL_WEWORK_AUTH_LIST_PATH:-}
      WORKTOOL_WEWORK_AUTH_SAVE_PATH: ${WORKTOOL_WEWORK_AUTH_SAVE_PATH:-}
      WORKTOOL_WEWORK_AUTH_DELETE_PATH: ${WORKTOOL_WEWORK_AUTH_DELETE_PATH:-}
      WORKTOOL_RENEW_TOKEN: ${WORKTOOL_RENEW_TOKEN:-}
      PRIVATE_LICENSE_SECRET_KEY: ${PRIVATE_LICENSE_SECRET_KEY:-}
      WORKTOOL_API_BASE: ${WORKTOOL_API_BASE:-}
      CALLBACK_PUBLIC_BASE_URL: ${CALLBACK_PUBLIC_BASE_URL:-}
      ADMIN_PHONE_WHITELIST: ${ADMIN_PHONE_WHITELIST:-}
      DEMO_ROBOT_IDS: ${DEMO_ROBOT_IDS:-worktool1}
      WORKTOOL_DB_HOST: ${WORKTOOL_DB_HOST:-}
      WORKTOOL_DB_PORT: ${WORKTOOL_DB_PORT:-3306}
      WORKTOOL_DB_USER: ${WORKTOOL_DB_USER:-}
      WORKTOOL_DB_PASSWORD: ${WORKTOOL_DB_PASSWORD:-}
      WORKTOOL_DB_NAME: ${WORKTOOL_DB_NAME:-}
      APP_UPLOAD_DIR: ${APP_UPLOAD_DIR:-/data/uploads}
      APP_PUBLIC_BASE_URL: ${APP_PUBLIC_BASE_URL:-}
      SMS_HUARUI_API_URL: ${SMS_HUARUI_API_URL:-}
      SMS_HUARUI_APPKEY: ${SMS_HUARUI_APPKEY:-}
      SMS_HUARUI_APPSECRET: ${SMS_HUARUI_APPSECRET:-}
      SMS_HUARUI_SIGN: ${SMS_HUARUI_SIGN:-【南京亚美达科技】}
      SMS_CODE_EXPIRE_MINUTES: ${SMS_CODE_EXPIRE_MINUTES:-15}
      DEFAULT_TEST_PROVIDER_ENABLED: ${DEFAULT_TEST_PROVIDER_ENABLED:-false}
      DEFAULT_TEST_PROVIDER_NAME: ${DEFAULT_TEST_PROVIDER_NAME:-AI模型(仅测试用)}
      DEFAULT_TEST_PROVIDER_BASE_URL: ${DEFAULT_TEST_PROVIDER_BASE_URL:-https://ark.cn-beijing.volces.com/api/coding/v3/chat/completions}
      DEFAULT_TEST_PROVIDER_API_KEY: ${DEFAULT_TEST_PROVIDER_API_KEY:-}
      DEFAULT_TEST_PROVIDER_MODEL: ${DEFAULT_TEST_PROVIDER_MODEL:-doubao-seed-2.0-lite}
      AI_PROVIDER_TIMEOUT_SECONDS: ${AI_PROVIDER_TIMEOUT_SECONDS:-60}
      QA_CALLBACK_WORKER_CONCURRENCY: ${QA_CALLBACK_WORKER_CONCURRENCY:-16}
      QA_CALLBACK_QUEUE_MAXSIZE: ${QA_CALLBACK_QUEUE_MAXSIZE:-2000}
      ROBOT_SHOW_NAME_CACHE_TTL_SECONDS: ${ROBOT_SHOW_NAME_CACHE_TTL_SECONDS:-600}
      CHAT_CONTEXT_ENABLED: ${CHAT_CONTEXT_ENABLED:-true}
      CHAT_CONTEXT_MAX_MESSAGES: ${CHAT_CONTEXT_MAX_MESSAGES:-20}
      CHAT_CONTEXT_RETENTION_DAYS: ${CHAT_CONTEXT_RETENTION_DAYS:-7}
    volumes:
      - ./uploads:/data/uploads
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "7"
    networks:
      - worktool-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${WEB_BIND_IP:-0.0.0.0}:${WEB_PORT:-18080}:80"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "7"
    networks:
      - worktool-net

  scheduler:
    build:
      context: .
      dockerfile: backend/Dockerfile
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped
    command: python scheduler_worker.py
    working_dir: /app/backend
    environment:
      TZ: Asia/Shanghai
      PYTHONUNBUFFERED: ${PYTHONUNBUFFERED:-1}
      APP_DEPLOYMENT_MODE: ${APP_DEPLOYMENT_MODE:-private}
      PRIVATE_OUTBOUND_ALLOW_LOOPBACK: ${PRIVATE_OUTBOUND_ALLOW_LOOPBACK:-false}
      APP_MYSQL_HOST: ${APP_MYSQL_HOST:-}
      APP_MYSQL_PORT: ${APP_MYSQL_PORT:-3306}
      APP_MYSQL_USER: ${APP_MYSQL_USER:-}
      APP_MYSQL_PASSWORD: ${APP_MYSQL_PASSWORD:-}
      APP_MYSQL_DATABASE: ${APP_MYSQL_DATABASE:-}
      APP_MYSQL_TIME_ZONE: ${APP_MYSQL_TIME_ZONE:-+08:00}
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:-}
      AUTH_JWT_EXPIRE_DAYS: ${AUTH_JWT_EXPIRE_DAYS:-30}
      AUTH_PBKDF2_ITERATIONS: ${AUTH_PBKDF2_ITERATIONS:-390000}
      AUTH_SMS_ENABLED: ${AUTH_SMS_ENABLED:-false}
      PRIVATE_ADMIN_USERNAME: ${PRIVATE_ADMIN_USERNAME:-admin}
      PRIVATE_ADMIN_PASSWORD: ${PRIVATE_ADMIN_PASSWORD:-}
      PRIVATE_SELF_REGISTRATION_ENABLED: ${PRIVATE_SELF_REGISTRATION_ENABLED:-false}
      ENABLE_TROUBLESHOOT: ${ENABLE_TROUBLESHOOT:-false}
      ENABLE_RUNTIME_WORKTOOL_SETTINGS: ${ENABLE_RUNTIME_WORKTOOL_SETTINGS:-false}
      ENABLE_ADMIN_IP_BLACKLIST: ${ENABLE_ADMIN_IP_BLACKLIST:-false}
      ENABLE_ADMIN_ENTERPRISE_AUTH: ${ENABLE_ADMIN_ENTERPRISE_AUTH:-false}
      ENABLE_OPEN_TROUBLESHOOT_API: ${ENABLE_OPEN_TROUBLESHOOT_API:-false}
      OPEN_TROUBLESHOOT_API_KEY: ${OPEN_TROUBLESHOOT_API_KEY:-}
      OPEN_TROUBLESHOOT_ALLOWED_ROBOT_IDS: ${OPEN_TROUBLESHOOT_ALLOWED_ROBOT_IDS:-}
      WORKTOOL_IPACL_QUERY_PATH: ${WORKTOOL_IPACL_QUERY_PATH:-}
      WORKTOOL_IPACL_ADD_PATH: ${WORKTOOL_IPACL_ADD_PATH:-}
      WORKTOOL_IPACL_DELETE_PATH: ${WORKTOOL_IPACL_DELETE_PATH:-}
      WORKTOOL_WEWORK_AUTH_LIST_PATH: ${WORKTOOL_WEWORK_AUTH_LIST_PATH:-}
      WORKTOOL_WEWORK_AUTH_SAVE_PATH: ${WORKTOOL_WEWORK_AUTH_SAVE_PATH:-}
      WORKTOOL_WEWORK_AUTH_DELETE_PATH: ${WORKTOOL_WEWORK_AUTH_DELETE_PATH:-}
      PRIVATE_LICENSE_SECRET_KEY: ${PRIVATE_LICENSE_SECRET_KEY:-}
      WORKTOOL_API_BASE: ${WORKTOOL_API_BASE:-}
      CALLBACK_PUBLIC_BASE_URL: ${CALLBACK_PUBLIC_BASE_URL:-}
      ADMIN_PHONE_WHITELIST: ${ADMIN_PHONE_WHITELIST:-}
      DEMO_ROBOT_IDS: ${DEMO_ROBOT_IDS:-worktool1}
      WORKTOOL_DB_HOST: ${WORKTOOL_DB_HOST:-}
      WORKTOOL_DB_PORT: ${WORKTOOL_DB_PORT:-3306}
      WORKTOOL_DB_USER: ${WORKTOOL_DB_USER:-}
      WORKTOOL_DB_PASSWORD: ${WORKTOOL_DB_PASSWORD:-}
      WORKTOOL_DB_NAME: ${WORKTOOL_DB_NAME:-}
      SMS_HUARUI_API_URL: ${SMS_HUARUI_API_URL:-}
      SMS_HUARUI_APPKEY: ${SMS_HUARUI_APPKEY:-}
      SMS_HUARUI_APPSECRET: ${SMS_HUARUI_APPSECRET:-}
      SMS_HUARUI_SIGN: ${SMS_HUARUI_SIGN:-【南京亚美达科技】}
      SMS_CODE_EXPIRE_MINUTES: ${SMS_CODE_EXPIRE_MINUTES:-15}
      DEFAULT_TEST_PROVIDER_ENABLED: ${DEFAULT_TEST_PROVIDER_ENABLED:-false}
      DEFAULT_TEST_PROVIDER_NAME: ${DEFAULT_TEST_PROVIDER_NAME:-AI模型(仅测试用)}
      DEFAULT_TEST_PROVIDER_BASE_URL: ${DEFAULT_TEST_PROVIDER_BASE_URL:-https://ark.cn-beijing.volces.com/api/coding/v3/chat/completions}
      DEFAULT_TEST_PROVIDER_API_KEY: ${DEFAULT_TEST_PROVIDER_API_KEY:-}
      DEFAULT_TEST_PROVIDER_MODEL: ${DEFAULT_TEST_PROVIDER_MODEL:-doubao-seed-2.0-lite}
      AI_PROVIDER_TIMEOUT_SECONDS: ${AI_PROVIDER_TIMEOUT_SECONDS:-60}
      SCHEDULER_POLL_SECONDS: ${SCHEDULER_POLL_SECONDS:-2}
      SCHEDULER_BATCH_LIMIT: ${SCHEDULER_BATCH_LIMIT:-20}
      CHAT_CONTEXT_ENABLED: ${CHAT_CONTEXT_ENABLED:-true}
      CHAT_CONTEXT_MAX_MESSAGES: ${CHAT_CONTEXT_MAX_MESSAGES:-20}
      CHAT_CONTEXT_RETENTION_DAYS: ${CHAT_CONTEXT_RETENTION_DAYS:-7}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "7"
    networks:
      - worktool-net

networks:
  worktool-net:
    driver: bridge
