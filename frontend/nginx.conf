# Callback URLs carry a per-robot event credential; omit their query strings from logs.
map $request_uri $console_log_uri {
    default $request_uri;
    ~^(?<console_callback_path>/api/v1/callback/qa/[^?]+) $console_callback_path;
}
log_format console_safe '$remote_addr - $remote_user [$time_local] '
                        '"$request_method $console_log_uri $server_protocol" '
                        '$status $body_bytes_sent "$http_referer" "$http_user_agent"';

server {
    listen 80;
    server_name _;
    access_log /var/log/nginx/access.log console_safe;
    resolver 127.0.0.11 valid=10s ipv6=off;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # Marketing pages and Console keep separate document roots.
    location = / {
        root /usr/share/nginx/marketing;
        try_files /index.html =404;
        add_header Cache-Control "no-cache";
    }

    location = /videos {
        absolute_redirect off;
        return 301 /videos/;
    }

    location ^~ /videos/ {
        absolute_redirect off;
        root /usr/share/nginx/marketing;
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
    }

    location ^~ /marketing-assets/ {
        root /usr/share/nginx/marketing;
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }

    location /api/ {
        client_max_body_size 10m;
        set $backend_upstream backend:8000;
        proxy_pass http://$backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 75s;
        proxy_send_timeout 75s;
    }

    location /test_callback_url/ {
        client_max_body_size 1m;
        set $backend_upstream backend:8000;
        proxy_pass http://$backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location /uploads/ {
        set $backend_upstream backend:8000;
        proxy_pass http://$backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location ^~ /share/enterprise {
        try_files /index.html =404;
        add_header Cache-Control "no-store" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    }

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /docs/assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    location = /version.json {
        try_files $uri =404;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    location = /sitemap.xml {
        add_header Cache-Control "public, max-age=300";
    }

    location = /robots.txt {
        add_header Cache-Control "public, max-age=300";
    }

    location = /llms.txt {
        add_header Cache-Control "public, max-age=300";
    }

    location = /llms-full.txt {
        add_header Cache-Control "public, max-age=300";
    }

    location ~ ^/docs/.*\.(?:html|xml|json)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=300";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }
}
